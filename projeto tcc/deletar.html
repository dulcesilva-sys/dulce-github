<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArtBridge - Excluir Conta</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#000;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:500px;
    max-width:90%;
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:35px;
    font-size:36px;
}

.info{
    margin-bottom:20px;
}

.opcao{
    display:flex;
    align-items:flex-start;
    gap:15px;
    background:#111;
    border:1px solid #333;
    border-radius:10px;
    padding:18px;
    cursor:pointer;
}

.opcao:hover{
    border-color:#dc2486;
}

.opcao input[type="radio"]{
    width:20px;
    height:20px;
    margin-top:5px;
    accent-color:#e51ea6;
}

.info h2{
    font-size:22px;
    margin-bottom:10px;
}

.info p{
    color:#bdbdbd;
    line-height:1.5;
    font-size:17px;
}

input[type="password"]{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    font-size:16px;
    background:#1f1f1f;
    color:white;
}

hr{
    border:none;
    height:1px;
    background:#333;
    margin:30px 0;
}

.desativar{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#e51eb3;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:20px;
}

.desativar:hover{
    background:#f028c1;
}

.excluir{
    display:block;
    text-align:center;
    color:#e31aa4;
    text-decoration:none;
    font-size:20px;
    font-weight:bold;
}

.excluir:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="container">

    <h1>Desativar sua conta em vez de excluí-la?</h1>

    <div class="info">
        <label class="opcao">
            <input type="radio" name="acao" value="desativar">

            <div>
                <h2>Desativação temporária</h2>

                <p>
                    Seu perfil, publicações, comentários e curtidas
                    ficarão ocultos até que você faça login novamente
                    no ArtBridge.
                </p>
            </div>
        </label>
    </div>

    <div class="info">
        <label class="opcao">
            <input type="radio" name="acao" value="excluir">

            <div>
                <h2>Exclusão permanente</h2>

                <p>
                    Seu perfil, publicações, comentários, seguidores
                    e demais informações serão removidos
                    permanentemente.
                </p>
            </div>
        </label>
    </div>

    <input type="password" placeholder="Digite sua senha">

    <input type="password" placeholder="Confirme sua senha">

    <hr>

    <button class="desativar">
        Continuar
    </button>

    <a href="#" class="excluir">
        Cancelar
    </a>

</div>

</body>
</html>
