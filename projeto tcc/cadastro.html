<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar Conta - ArtBridge</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background-image:url("imagens/CAPS.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.cadastro{
    width:430px;
    background:rgba(0,0,0,0.75);
    padding:40px;
    border-radius:10px;
    text-align:center;
}

.logo{
    background:white;
    color:black;
    display:inline-block;
    padding:8px 20px;
    font-size:40px;
    font-family:"Times New Roman", serif;
    margin-bottom:25px;
}

h2{
    color:white;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    border-radius:5px;
    font-size:15px;
}

button{
    width:100%;
    padding:12px;
    background:white;
    color:black;
    border:none;
    border-radius:5px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ddd;
}

.login{
    margin-top:20px;
    color:#ccc;
}

.login a{
    color:white;
    text-decoration:none;
}

.login a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="cadastro">

    <div class="logo">
        ARTBRIDGE
    </div>

    <h2>Criar Conta</h2>

    <input type="text" placeholder="Nome completo">

    <input type="email" placeholder="E-mail">

    <input type="password" placeholder="Criar senha">

    <input type="password" placeholder="Confirmar senha">

    <button>Criar Conta</button>

    <div class="login">
        Já possui uma conta?
        <a href="login.html">Entrar</a>
    </div>

</div>

</body>
</html>
